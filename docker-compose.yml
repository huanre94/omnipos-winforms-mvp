services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omnipos-sqlserver
    hostname: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      # Descomentar para restaurar backups
      # - ./docker/sql-backup:/var/opt/mssql/backup:ro
      # Descomentar para ejecutar scripts de inicialización
      # - ./docker/sql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - omnipos-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Opcional: Adminer para gestión web de la BD
  # Descomentar las siguientes líneas para habilitar Adminer
  # adminer:
  #   image: adminer:latest
  #   container_name: omnipos-adminer
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     ADMINER_DEFAULT_SERVER: sqlserver
  #   networks:
  #     - omnipos-network
  #   depends_on:
  #     sqlserver:
  #       condition: service_healthy

volumes:
  sqlserver_data:
    name: omnipos-sqlserver-data

networks:
  omnipos-network:
    name: omnipos-network
    driver: bridge

